[project]
name = "ripdude"
version = "0.1.0"
description = "Cluster of multipurpose AI agents."
readme = "README.md"
authors = [
    { name = "Wiktor Kabanow", email = "kabanowster@gmail.com" }
]
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.141.1",
    "fastmcp==4.0.5",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langchain-core>=1.6.3",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-redis>=0.5.2",
    "pydantic>=2.13.5",
    "redis>=8.1.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
ripdude = "ripdude.project.scripts:ripdude"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
