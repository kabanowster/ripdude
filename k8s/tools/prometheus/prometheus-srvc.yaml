apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    stack: prometheus
spec:
  selector:
    prometheus: prometheus-kube-prometheus-prometheus
    app.kubernetes.io/name: prometheus
  ports:
    - protocol: TCP
      port: 9090
      nodePort: 30500
  type: NodePort
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    stack: prometheus
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - protocol: TCP
      port: 3000
      nodePort: 30600
  type: NodePort