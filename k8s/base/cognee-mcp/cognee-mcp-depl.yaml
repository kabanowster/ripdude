apiVersion: apps/v1
kind: Deployment
metadata:
  name: cognee-mcp
spec:
  replicas: 1
  revisionHistoryLimit: 0
  template:
    metadata:
      name: cognee-mcp
    spec:
      containers:
        - name: cognee-mcp
          image: cognee/cognee-mcp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: cognee-mcp
          restartPolicy: Always