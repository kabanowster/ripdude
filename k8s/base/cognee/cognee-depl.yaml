apiVersion: apps/v1
kind: Deployment
metadata:
  name: cognee
spec:
  replicas: 1
  revisionHistoryLimit: 0
  template:
    metadata:
      name: cognee
    spec:
      containers:
        - name: cognee
          image: docker.io/library/cognee:falkor
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: cognee
          restartPolicy: Always
          volumeMounts:
            - mountPath: /cognee-storage/data
              name: cognee
              subPath: data
            - mountPath: /cognee-storage/system
              name: cognee
              subPath: system
            - mountPath: /fastembed
              name: cognee
              subPath: fastembed
      volumes:
        - name: cognee
          persistentVolumeClaim:
            claimName: cognee