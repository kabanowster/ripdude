apiVersion: v1
kind: ConfigMap
metadata:
  name: cognee
data:
  GRAPH_DATABASE_PROVIDER: "falkor"
  GRAPH_DATABASE_URL: "falkordb"
  GRAPH_DATABASE_PORT: "6379"

  VECTOR_DB_PROVIDER: "falkor"
  VECTOR_DB_URL: "falkordb"
  VECTOR_DB_PORT: "6379"

  CACHING: "true"
  CACHE_BACKEND: "redis"
  CACHE_HOST: "redis"
  CACHE_PORT: "6379"

  LLM_PROVIDER: "openai"
  LLM_MODEL: "openai/reasoning"
  LLM_ENDPOINT: "http://llama:8000/v1"
  LLM_API_KEY: "."
  LITELLM_DROP_PARAMS: "true"
  COGNEE_SKIP_CONNECTION_TEST: "true"
  LLM_MAX_COMPLETION_TOKENS: "60000"
  STRUCTURED_OUTPUT_FRAMEWORK: "instructor"
  LLM_INSTRUCTOR_MODE: "json_schema_mode"

  EMBEDDING_PROVIDER: "fastembed"
  EMBEDDING_MODEL: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  EMBEDDING_DIMENSIONS: "384"
  FASTEMBED_CACHE_PATH: "/fastembed"
  EMBEDDING_BATCH_SIZE: "16"

  DB_PROVIDER: "sqlite"
  DB_NAME: "cognee_db"

  ENABLE_BACKEND_ACCESS_CONTROL: "false"
  REQUIRE_AUTHENTICATION: "false"
  CORS_ALLOWED_ORIGINS: "*"

  DEFAULT_USER_EMAIL: "default_user@example.com"
  DEFAULT_USER_PASSWORD: "default_password"