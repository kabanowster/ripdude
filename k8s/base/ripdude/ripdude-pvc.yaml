apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ripdude-harness
spec:
  volumeName: ripdude-harness
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ripdude-workspace
spec:
  volumeName: ripdude-workspace
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi