apiVersion: v1
kind: PersistentVolume
metadata:
  name: ripdude-harness
  labels:
    target: cluster
spec:
  hostPath:
    path: harness
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ripdude-workspace
  labels:
    target: cluster
spec:
  hostPath:
    path: workspace
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain