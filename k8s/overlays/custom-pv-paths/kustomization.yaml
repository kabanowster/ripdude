apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - patch: |-
      apiVersion: v1
      kind: PersistentVolume
      metadata:
        name: redis
      spec:
        hostPath:
          path: /home/dev/.redis-data
  - patch: |-
      apiVersion: v1
      kind: PersistentVolume
      metadata:
        name: ollama
      spec:
        hostPath:
          path: /home/dev/.ollama-models
  - patch: |-
      apiVersion: v1
      kind: PersistentVolume
      metadata:
        name: falkordb
      spec:
        hostPath:
          path: /home/dev/.falkor-data
  - patch: |-
      apiVersion: v1
      kind: PersistentVolume
      metadata:
        name: cognee
      spec:
        hostPath:
          path: /home/dev/.cognee-storage